<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>School App</title>
    <script>
      // Light or dark before the first paint, so the page never flashes the
      // wrong colours. The same rule as resolveTheme() in src/lib/theme.ts.
      (function () {
        var choice = 'system';
        try {
          choice = localStorage.getItem('campus-theme') || 'system';
        } catch (e) {}
        var light =
          choice === 'light' ||
          (choice === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
        if (light) document.documentElement.classList.add('light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

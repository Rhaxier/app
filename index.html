    <!-- viewport-fit=cover: in the installed app the page runs under the
         status bar and the home indicator; the CSS keeps content clear of
         them with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The browser bar's colour in each theme (--paper). src/lib/theme.ts
         sets both to the theme chosen under Me > Appearance. -->
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

         iPhone"). The app opens full screen with its own icon and name. The

    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="School App" />
    <!-- The installed app draws under the status bar, like a native app. -->

    <!-- The page's background before any stylesheet arrives (an installed
         app shows it while starting): the same colours as --paper. -->
    <style>
      html {
        background: #000;
      }
      html.light {
        background: #f2f2f7;
      }
    </style>
    <script>
      // Light or dark before the first paint, so the page never flashes the
      // wrong colours. The same rule as resolveTheme() in src/lib/theme.ts,
      // and the browser bar follows (THEME_COLOR there).
      (function () {
        var choice = 'system';
        try {
          choice = localStorage.getItem('campus-theme') || 'system';
        } catch (e) {}
        var light =
          choice === 'light' ||
          (choice === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
        if (light) document.documentElement.classList.add('light');
        if (choice !== 'system') {
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) {
            metas[i].setAttribute('content', light ? '#f2f2f7' : '#000000');
          }
        }
      })();
    </script>

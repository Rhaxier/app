    <!-- The page's background before any stylesheet arrives (an installed
         app shows it while starting): the same colours as --paper. -->
    <style>
      html {
        background: #000;
      }
      html.light {
        background: #f2f2f7;
      }

      /* The loading screen (src/lib/splash.ts): the school's crest and name,
         on the app's own background, until the first screen is ready. Plain
         CSS here, because it shows before any of the app's styles load. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding-bottom: 6vh;
        background: #000;
        color: #fff;
        font-family:
          'Instrument Sans',
          -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
        transition:
          opacity 320ms cubic-bezier(0.2, 0, 0, 1),
          visibility 0s linear 320ms;
      }
      html.light #splash {
        background: #f2f2f7;
        color: #000;
      }
      #splash.out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #splash-mark {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        transition: transform 320ms cubic-bezier(0.2, 0, 0, 1);
      }
      /* Leaving: the crest and name ease back a touch as they fade. */
      #splash.out #splash-mark {
        transform: scale(0.97);
      }
      #splash-logo {
        width: 112px;
        height: 112px;
        object-fit: contain;
        filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.35));
        animation: splash-logo 640ms cubic-bezier(0.2, 0, 0, 1) both;
      }
      html.light #splash-logo {
        filter: drop-shadow(0 10px 24px rgba(16, 24, 40, 0.16));
      }
      #splash-name {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
        line-height: 22px;
        letter-spacing: -0.01em;
        text-align: center;
        animation: splash-fade 480ms 140ms cubic-bezier(0.2, 0, 0, 1) both;
      }
      #splash-name:empty {
        display: none;
      }
      /* Only for a slow start: a slim line that appears after a second. */
      #splash-progress {
        position: relative;
        overflow: hidden;
        width: 72px;
        height: 3px;
        margin-top: 10px;
        border-radius: 2px;
        background: rgba(120, 120, 128, 0.24);
        animation: splash-fade 400ms 1000ms ease-out both;
      }
      #splash-progress::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: rgba(235, 235, 245, 0.6);
        animation: splash-slide 1100ms cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      html.light #splash-progress::after {
        background: rgba(60, 60, 67, 0.62);
      }
      @keyframes splash-logo {
        from {
          opacity: 0;
          transform: scale(0.92);
        }
      }
      @keyframes splash-fade {
        from {
          opacity: 0;
        }
      }
      @keyframes splash-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      /* Less motion: everything only fades. */
      @media (prefers-reduced-motion: reduce) {
        #splash-logo {
          animation-name: splash-fade;
        }
        #splash.out #splash-mark {
          transform: none;
        }
        #splash-progress::after {
          animation: none;
          width: 100%;
          opacity: 0.5;
        }
      }
    </style>
    <script>
      // Light or dark before the first paint, so the page never flashes the
      // wrong colours. The same rule as resolveTheme() in src/lib/theme.ts,
      // and the browser bar follows (THEME_COLOR there).
      (function () {
        var choice = 'system';
        try {
          choice = localStorage.getItem('campus-theme') || 'system';
        } catch (e) {}
        var light =
          choice === 'light' ||
          (choice === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
        if (light) document.documentElement.classList.add('light');
        if (choice !== 'system') {
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) {
            metas[i].setAttribute('content', light ? '#f2f2f7' : '#000000');
          }
        }
      })();
    </script>

  <body>
    <!-- The loading screen (src/lib/splash.ts). Decorative: screen readers
         get the app's own loading message instead. -->
    <div id="splash" aria-hidden="true">
      <div id="splash-mark">
        <img id="splash-logo" src="/brand/school-crest.webp" alt="" />
        <p id="splash-name">GEMS Modern Academy</p>
      </div>
      <span id="splash-progress"></span>
    </div>
    <script>
      // The crest and name remembered from the last visit (rememberBrand in
      // src/lib/splash.ts, key "campus-brand"), so a new crest or name set
      // under Branding shows here too. Before any visit: the bundled crest and
      // the school's name as Branding had them when this was written.
      (function () {
        try {
          var brand = JSON.parse(localStorage.getItem('campus-brand') || 'null');
          if (brand && brand.logo) document.getElementById('splash-logo').src = brand.logo;
          if (brand && brand.name) document.getElementById('splash-name').textContent = brand.name;
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    The app's home-screen icon: a placeholder until the school chooses one
    (docs/OPEN_QUESTIONS.md). The same mark as public/favicon.svg (a line
    mortarboard, 1.8 stroke at icon size) on the design's accent blue, with
    the liquid glass sheen from the top-left (src/styles/glass.css).
    Full-bleed square: iOS and Android round the corners themselves.
    The PNGs are made from app-icon-1024.png by make_icons.py (README.md).
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a9bff" />
      <stop offset="1" stop-color="#0062e0" />
    </linearGradient>
    <radialGradient id="sheen" cx="0.18" cy="-0.1" r="0.95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34" />
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="1.05" r="0.7">
      <stop offset="0" stop-color="#001a66" stop-opacity="0.35" />
      <stop offset="1" stop-color="#001a66" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#tile)" />
  <rect width="1024" height="1024" fill="url(#glow)" />
  <rect width="1024" height="1024" fill="url(#sheen)" />
  <!-- The favicon's mark (32-unit box), scaled to sit in the middle 55%. -->
  <g
    transform="translate(512 520) scale(34) translate(-16 -14.85)"
    fill="none"
    stroke="#ffffff"
    stroke-width="1.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M8 13 16 8l8 5-8 5z" />
    <path d="M11 15v5c3 2 7 2 10 0v-5" />
  </g>
</svg>
